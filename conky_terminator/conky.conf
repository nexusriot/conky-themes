conky.config = {
    alignment          = 'top_right',
    gap_x              = 20,
    gap_y              = 40,
    minimum_width      = 320,
    minimum_height     = 600,
    maximum_width      = 320,
    background         = true,
    border_width       = 0,
    cpu_avg_samples    = 2,
    net_avg_samples    = 2,
    double_buffer      = true,
    draw_borders       = false,
    draw_graph_borders = false,
    draw_outline       = false,
    draw_shades        = false,
    use_xft            = true,
    font               = 'DejaVu Sans Mono:size=9',
    xftalpha           = 0.9,
    update_interval    = 1.0,
    own_window         = true,
    own_window_class   = 'Conky',
    own_window_type    = 'desktop',
    own_window_transparent  = false,
    own_window_argb_visual  = true,
    own_window_argb_value   = 22,
    own_window_hints   = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    stippled_borders   = 0,
    use_spacer         = 'none',
    show_graph_scale   = false,
    show_graph_range   = false,
    lua_load           = '~/.config/conky/conky_terminator/terminator.lua',
    lua_draw_hook_pre  = 'terminator_draw',
    default_color      = 'FF4422',
    color0             = 'FF2200',  -- hot red    (section headers)
    color1             = 'FF6644',  -- light red  (values)
    color2             = '882200',  -- dim red    (labels)
    color3             = 'FF6600',  -- orange     (highlight)
    color4             = 'FFAA00',  -- amber      (warning)
}

conky.text = [[
${voffset 85}
${alignc}${color0}${font DejaVu Sans Mono:bold:size=11}TARGET ACQUIRED${font}${color}
${alignc}${color2}SKYNET UPLINK ESTABLISHED${color}
${voffset 2}
${color2}UNIT ID   ${color}${alignr}${color1}${nodename}${color}
${color2}OS BUILD  ${color}${alignr}${color1}${kernel}${color}
${color2}UPTIME    ${color}${alignr}${color1}${uptime}${color}
${color2}SYS LOAD  ${color}${alignr}${color1}${loadavg 1}  ${loadavg 5}  ${loadavg 15}${color}
${voffset 2}
${color0}${font DejaVu Sans Mono:bold:size=9}>> NEURAL PROCESSOR <<${font}${color}
${color2}CAPACITY  ${color}${alignr}${color1}${cpu cpu0}%${color}
${color2}${cpubar cpu0 6,290}${color}
${color2}CORE TEMP ${color}${alignr}${color3}${execi 10 sensors 2>/dev/null | awk '/Package id 0/{gsub(/[^0-9.]/,"",$4); print $4"C"}'}${color}
${color2}C0 ${color3}${cpu cpu1}%${color}  ${color2}C1 ${color3}${cpu cpu2}%${color}  ${color2}C2 ${color3}${cpu cpu3}%${color}  ${color2}C3 ${color3}${cpu cpu4}%${color}
${color2}PRIORITY TARGETS${color}
${color2}01${color} ${color1}${top name 1}${color}${alignr}${color3}${top cpu 1}%${color}
${color2}02${color} ${color1}${top name 2}${color}${alignr}${color3}${top cpu 2}%${color}
${color2}03${color} ${color1}${top name 3}${color}${alignr}${color3}${top cpu 3}%${color}
${voffset 2}
${color0}${font DejaVu Sans Mono:bold:size=9}>> POWER CELLS <<${font}${color}
${color2}RAM       ${color}${alignr}${color1}${mem}${color} / ${memmax}
${color2}${membar 6,290}${color}
${color2}SWAP      ${color}${alignr}${color1}${swap}${color} / ${swapmax}
${color2}${swapbar 6,290}${color}
${voffset 2}
${color0}${font DejaVu Sans Mono:bold:size=9}>> DATA CORES <<${font}${color}
${color2}ROOT      ${color}${alignr}${color1}${fs_used /}${color} / ${fs_size /}
${color2}${fs_bar 6,290 /}${color}
${color2}HOME      ${color}${alignr}${color1}${fs_used /home}${color} / ${fs_size /home}
${color2}${fs_bar 6,290 /home}${color}
${voffset 2}
${color0}${font DejaVu Sans Mono:bold:size=9}>> NETWORK UPLINK <<${font}${color}
${color2}INTERFACE ${color}${alignr}${color1}${gw_iface}${color}
${color2}LOCAL IP  ${color}${alignr}${color1}${addr ${gw_iface}}${color}
${color2}RX        ${color}${alignr}${color1}${downspeed ${gw_iface}}${color}
${color2}TX        ${color}${alignr}${color1}${upspeed ${gw_iface}}${color}
${color2}${downspeedgraph ${gw_iface} 28,140 1A0000 FF4422}${color} ${color2}${upspeedgraph ${gw_iface} 28,140 1A0000 FF6600}${color}
${voffset 3}
${alignc}${color2}THREAT LEVEL: ${color4}${cpu cpu0}%${color}
${color2}PROCESSES: ${color}${color1}${processes}${color}   ${color2}RUNNING: ${color}${color1}${running_processes}${color}
]]
