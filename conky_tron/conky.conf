conky.config = {
    alignment          = 'top_left',
    gap_x              = 20,
    gap_y              = 40,
    minimum_width      = 320,
    minimum_height     = 600,
    maximum_width      = 320,
    background         = true,
    border_width       = 0,
    cpu_avg_samples    = 2,
    net_avg_samples    = 2,
    double_buffer      = true,
    draw_borders       = false,
    draw_graph_borders = false,
    draw_outline       = false,
    draw_shades        = false,
    use_xft            = true,
    font               = 'JetBrains Mono:size=9',
    xftalpha           = 0.9,
    update_interval    = 1.0,
    own_window         = true,
    own_window_class   = 'Conky',
    own_window_type    = 'desktop',
    own_window_transparent  = false,
    own_window_argb_visual  = true,
    own_window_argb_value   = 18,
    own_window_hints   = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    stippled_borders   = 0,
    use_spacer         = 'none',
    show_graph_scale   = false,
    show_graph_range   = false,
    lua_load           = '~/.config/conky/conky_tron/tron_grid.lua',
    lua_draw_hook_pre  = 'tron_draw',
    default_color      = '4DDDFF',
    color0             = '00BFFF',  -- electric blue  (section headers)
    color1             = 'A8EEFF',  -- pale cyan       (values)
    color2             = '2A6A8A',  -- dim blue        (labels)
    color3             = 'FF8C00',  -- orange          (highlight / warn)
}

conky.text = [[
${voffset 4}${alignc}${color0}${font JetBrains Mono:bold:size=12}T R O N   G R I D${font}${color}
${alignc}${color2}[ GRID SYSTEM ONLINE ]${color}
${voffset 3}
${color2}HOST  ${color}${alignr}${nodename}
${color2}OS    ${color}${alignr}${execi 3600 lsb_release -ds 2>/dev/null || uname -o}
${color2}KERNEL${color}${alignr}${kernel}
${color2}UPTIME${color}${alignr}${uptime}
${color2}LOAD  ${color}${alignr}${loadavg 1}  ${loadavg 5}  ${loadavg 15}
${voffset 3}
${color0}${font JetBrains Mono:bold:size=9}-- CORE PROCESSOR --${font}${color}
${color2}USAGE ${color}${alignr}${color1}${cpu cpu0}%${color}
${color2}${cpubar cpu0 6,290}${color}
${color2}TEMP  ${color}${alignr}${color3}${execi 10 sensors 2>/dev/null | awk '/Package id 0/{gsub(/[^0-9.]/,"",$4); print $4"C"}'}${color}
${color2}C0 ${color3}${cpu cpu1}%${color} ${color2}C1 ${color3}${cpu cpu2}%${color} ${color2}C2 ${color3}${cpu cpu3}%${color} ${color2}C3 ${color3}${cpu cpu4}%${color}
${color2}// GRID PROCESSES${color}
${color2} 1${color} ${color1}${top name 1}${alignr}${color3}${top cpu 1}%${color}
${color2} 2${color} ${color1}${top name 2}${alignr}${color3}${top cpu 2}%${color}
${color2} 3${color} ${color1}${top name 3}${alignr}${color3}${top cpu 3}%${color}
${voffset 3}
${color0}${font JetBrains Mono:bold:size=9}-- MEMORY BANKS --${font}${color}
${color2}RAM   ${color}${alignr}${color1}${mem}${color} / ${memmax}
${color2}${membar 6,290}${color}
${color2}SWAP  ${color}${alignr}${color1}${swap}${color} / ${swapmax}
${color2}${swapbar 6,290}${color}
${voffset 3}
${color0}${font JetBrains Mono:bold:size=9}-- DATA STORAGE --${font}${color}
${color2}ROOT  ${color}${alignr}${color1}${fs_used /}${color} / ${fs_size /}
${color2}${fs_bar 6,290 /}${color}
${color2}HOME  ${color}${alignr}${color1}${fs_used /home}${color} / ${fs_size /home}
${color2}${fs_bar 6,290 /home}${color}
${voffset 3}
${color0}${font JetBrains Mono:bold:size=9}-- NETWORK UPLINK --${font}${color}
${color2}IFACE ${color}${alignr}${color1}${gw_iface}${color}
${color2}LOCAL ${color}${alignr}${color1}${addr ${gw_iface}}${color}
${color2}DOWN  ${color}${alignr}${color1}${downspeed ${gw_iface}}${color}
${color2}UP    ${color}${alignr}${color1}${upspeed ${gw_iface}}${color}
${color2}${downspeedgraph ${gw_iface} 28,140 001A33 00FFFF}${color} ${color2}${upspeedgraph ${gw_iface} 28,140 001A33 FF8C00}${color}
${voffset 3}
${color0}${font JetBrains Mono:bold:size=9}-- SYSTEM CLOCK --${font}${color}
${alignc}${color1}${font JetBrains Mono:bold:size=18}${time %H:%M:%S}${font}${color}
${alignc}${color2}${time %A  %d %B %Y}${color}
]]
